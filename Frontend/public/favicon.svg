<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fond : carré arrondi noir chaud, filet doré -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#0d0b08"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="12.5" fill="none" stroke="#c9a45c" stroke-opacity="0.55" stroke-width="1.5"/>
  <!-- Whisky dans le verre (dégradé ambré) -->
  <defs>
    <linearGradient id="ambre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2b65f"/>
      <stop offset="1" stop-color="#9a5a1c"/>
    </linearGradient>
  </defs>
  <g transform="translate(32 34) scale(1.3) translate(-32 -34)">
    <path d="M19.6 33 H44.4 L43.2 46.5 Q42.9 49 40.4 49 H23.6 Q21.1 49 20.8 46.5 Z" fill="url(#ambre)"/>
    <!-- Glaçon -->
    <rect x="27" y="29.5" width="9" height="8" rx="1.6" fill="#fff" fill-opacity="0.35" transform="rotate(-12 31.5 33.5)"/>
    <!-- Verre : contour doré -->
    <path d="M18 17 H46 L43.6 47 Q43.2 51 39.4 51 H24.6 Q20.8 51 20.4 47 Z" fill="none" stroke="#c9a45c" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- Reflet -->
    <path d="M22.6 21 L24 44" stroke="#fff" stroke-opacity="0.25" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
